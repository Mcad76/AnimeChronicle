name: Actualizar noticias

# 06:00 y 15:00 en España. GitHub solo entiende UTC, así se programan los cuatro
# horarios UTC posibles (invierno/verano) y un guardia filtra la hora local.
on:
  schedule:
    - cron: '0 4,5,13,14 * * *'
  workflow_dispatch:

permissions:
  contents: write   # necesario para que el bot haga commit de las noticias

concurrency:
  group: actualizar-animechronicle
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar noticias y generar archivos
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          EVENTO="${{ github.event_name }}"
          if [ "$EVENTO" != "workflow_dispatch" ] && [ "$HORA" != "06" ] && [ "$HORA" != "15" ]; then
            echo "Son las $HORA en España: no es hora de actualizar, se omite."
            exit 0
          fi
          echo "Son las $HORA en España: actualizando."
          python actualizar_noticias.py

      # Comprobación diaria: si algo falla, el workflow falla y queda registrado.
      - name: Verificar que la actualización se ha realizado correctamente
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          base = Path('.')
          errores = []

          historico = base / 'datos' / 'historico.json'
          if not historico.exists():
              errores.append('falta datos/historico.json')
              noticias = []
          else:
              datos = json.loads(historico.read_text(encoding='utf-8'))
              noticias = datos.get('noticias', [])
              actualizado = datos.get('actualizado', '')
              hoy = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).date().isoformat()
              if not actualizado.startswith(hoy):
                  errores.append(f'actualizado es {actualizado!r}, no de hoy {hoy}')
              if len(noticias) < 100:
                  errores.append(f'solo {len(noticias)} noticias')

          faltan = [n['image'] for n in noticias
                    if n.get('image', '').startswith('imagenes/')
                    and not (base / n['image']).exists()]
          if faltan:
              errores.append(f'{len(faltan)} imagenes ausentes')

          js = base / 'js' / 'news-data.js'
          if not js.exists():
              errores.append('falta js/news-data.js')
          else:
              texto = js.read_text(encoding='utf-8')
              for clave in ('const NOTICIAS', 'const TENDENCIAS', 'const GENEROS'):
                  if clave not in texto:
                      errores.append(f'falta {clave} en news-data.js')
              if texto.count('  A("') < 100:
                  errores.append('menos de 100 noticias en news-data.js')

          paginas = list((base / 'noticias').glob('*.html'))
          if len(paginas) < 100:
              errores.append(f'solo {len(paginas)} paginas de noticia')

          for archivo in ('sitemap.xml', 'robots.txt', 'index.html',
                          'archivo.html', 'glosario.html'):
              ruta = base / archivo
              if not ruta.exists() or ruta.stat().st_size < 40:
                  errores.append(f'{archivo} ausente o vacio')

          if errores:
              print('VERIFICACION FALLIDA:')
              for e in errores:
                  print('  -', e)
              sys.exit(1)

          print(f'VERIFICACION OK: {len(noticias)} noticias, '
                f'{len(paginas)} paginas, '
                f'{sum(1 for n in noticias if n.get("image", "").startswith("imagenes/"))} fotos')
          PY

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/news-data.js datos/historico.json datos/portadas.json imagenes/ noticias/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas; no se hace commit."
          else
            git commit -m "Actualizar noticias $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Resumen final
        if: always()
        run: |
          echo "==========================================="
          echo "Resultado del job: ${{ job.status }}"
          echo "Fecha UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Noticias en el archivo: $(python3 -c "import json;print(len(json.load(open('datos/historico.json'))['noticias']))" 2>/dev/null || echo '?')"
          echo "==========================================="
